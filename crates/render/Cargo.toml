[package]
name = "flightcraft-render"
description = "Scene description and wgpu drawing of the world and aircraft."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
flightcraft-world.workspace = true
flightcraft-aero.workspace = true
serde_json.workspace = true
flightcraft-sim.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true

image.workspace = true
gltf.workspace = true
serde.workspace = true
schemars.workspace = true

[dev-dependencies]
naga.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true
# Compile out transport byte dumps, including in debug builds.
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["RequestRedirect", "RequestCredentials", "RequestMode"] }
