[package]
name = "flightcraft-ui"
description = "The egui front end: instruments, views, input, and theme."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
whisper = ["desktop-audio", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:rayon"]
desktop-audio = ["dep:cpal"]

[dependencies]
flightcraft-control.workspace = true
flightcraft-render.workspace = true
flightcraft-sim.workspace = true
flightcraft-world.workspace = true
flightcraft-aero.workspace = true
libm.workspace = true
ab_glyph.workspace = true
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
gilrs = { workspace = true, features = ["serde-serialize"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite.workspace = true
getrandom.workspace = true
cpal = { workspace = true, optional = true }
base64.workspace = true
sha2.workspace = true
ureq.workspace = true
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "AudioNode", "AudioDestinationNode", "GainNode", "AudioParam", "SpeechSynthesis", "SpeechSynthesisUtterance", "SpeechSynthesisVoice", "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "MediaStreamAudioSourceNode", "AnalyserNode"] }
wasm-bindgen-futures.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true

[dev-dependencies]
wgpu.workspace = true
egui-wgpu.workspace = true
pollster.workspace = true
