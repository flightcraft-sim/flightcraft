[package]
name = "flightcraft-ui"
description = "The egui front end: instruments, views, input, and theme."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
desktop-audio = ["dep:cpal"]

[dependencies]
flightcraft-control.workspace = true
flightcraft-render.workspace = true
flightcraft-sim.workspace = true
flightcraft-world.workspace = true
flightcraft-aero.workspace = true
libm.workspace = true
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
gilrs = { workspace = true, features = ["serde-serialize"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom.workspace = true
cpal = { workspace = true, optional = true }
base64.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioDestinationNode", "GainNode", "AudioParam"] }
wasm-bindgen-futures.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true

[dev-dependencies]
wgpu.workspace = true
egui-wgpu.workspace = true
pollster.workspace = true
