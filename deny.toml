# `cargo deny check licenses advisories bans sources` runs in CI. No copyleft, ever.
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MIT-0", "BSL-1.0", "0BSD",
]
confidence-threshold = 0.9

[advisories]
yanked = "warn"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
