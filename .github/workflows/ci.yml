name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: Format, layers, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the desktop app
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev
      - run: cargo fmt --all --check
      - run: cargo xtask layers
      - run: cargo xtask schemas --check
      - run: cargo xtask determinism
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown -p flightcraft-world -p flightcraft-aero -p flightcraft-sim -p flightcraft-control -p flightcraft-web -p flightcraft-mcp
      - name: Install the wasm-bindgen CLI version from Cargo.lock
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo xtask web
      - uses: actions/upload-artifact@v4
        with:
          name: flightcraft-web
          path: dist/
          if-no-files-found: error

  golden:
    name: Golden trajectory (${{ matrix.os }})
    # The same trajectory hash on every platform. Not on pull requests: those runners cost more.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p flightcraft-sim

  golden-wasm:
    name: Golden trajectory (wasm32-wasip1)
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned official Wasmtime release
        run: |
          curl --fail --location --retry 3 --output wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.5/wasmtime-v49.0.5-x86_64-linux.tar.xz
          tar -xJf wasmtime.tar.xz
          echo "$PWD/wasmtime-v49.0.5-x86_64-linux" >> "$GITHUB_PATH"
      # WASI preview 1 uses the normal Rust test harness, with one test thread.
      # The existing test asserts the same fixed hash as native; no separate wasm baseline.
      - run: cargo test --locked -p flightcraft-sim --test golden --target wasm32-wasip1 -- --test-threads=1

  licences:
    name: Licences and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
