[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
# Not on crates.io: crates are versioned and released together from this repository.
publish = false
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
authors = ["FlightCraft contributors"]
repository = "https://github.com/flightcraft-sim/flightcraft"

[workspace.dependencies]
flightcraft-world = { path = "crates/world" }
flightcraft-aero = { path = "crates/aero" }
flightcraft-sim = { path = "crates/sim" }
flightcraft-control = { path = "crates/control" }
flightcraft-render = { path = "crates/render" }
flightcraft-ui = { path = "crates/ui" }

getrandom = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1"
serde_path_to_error = "0.1"
syn = { version = "2", features = ["full", "visit"] }
jsonschema = { version = "0.37", default-features = false }
# Pure-Rust maths functions: the same bits on every platform (the deterministic core uses only these).
libm = "0.2"
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "persistence", "x11", "wayland"] }
egui-wgpu = { version = "=0.33.3", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "webgpu", "webgl", "fragile-send-sync-non-atomic-wasm"] }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
naga = { version = "27", features = ["wgsl-in", "glsl-out"] }
gilrs = "0.11"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Location", "UrlSearchParams", "Response", "ReadableStream", "ReadableStreamDefaultReader", "Url", "console"] }
cpal = { version = "0.16", default-features = false }
pollster = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2
